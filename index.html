    <!--
      Random theme picker: runs synchronously before the page paints,
      so there is zero flash and zero added load time. It just sets a
      handful of CSS variables — every color/gradient in the site reads
      from these, so a fresh random palette applies on every reload.
      Nothing here touches layout, fonts, or JS bundle size.
    -->
    <script>
      (function () {
        var themes = [
          { name: 'Galaxy Nebula', a1: '168,85,247', a2: '217,70,239', a3: '236,72,153', glow: '168,85,247', bg1: '#0a0014', bg2: '#1f0033', bg3: '#33004d' },

          { name: 'Neon Grid', a1: '74,222,128', a2: '34,211,238', a3: '232,121,249', glow: '74,222,128', bg1: '#000000', bg2: '#0a0a0a', bg3: '#001a1a' },
          { name: 'Cyber Galaxy', a1: '56,189,248', a2: '236,72,153', a3: '168,85,247', glow: '236,72,153', bg1: '#05000f', bg2: '#10002e', bg3: '#1a0033' },
          { name: 'Purple Stars', a1: '196,181,253', a2: '168,85,247', a3: '216,180,254', glow: '196,181,253', bg1: '#0d0518', bg2: '#190a2e', bg3: '#241040' },
          { name: 'Dark Abstract', a1: '148,163,184', a2: '139,92,246', a3: '100,116,139', glow: '148,163,184', bg1: '#08090a', bg2: '#121316', bg3: '#1a1c20' },
          { name: 'Aurora Sky', a1: '52,211,153', a2: '56,189,248', a3: '129,140,248', glow: '52,211,153', bg1: '#001410', bg2: '#001d2e', bg3: '#0a1a33' },
          { name: 'Digital Universe', a1: '34,211,238', a2: '59,130,246', a3: '147,197,253', glow: '34,211,238', bg1: '#000a14', bg2: '#001628', bg3: '#002038' },
        ];
        var t = themes[Math.floor(Math.random() * themes.length)];
        var root = document.documentElement.style;
        root.setProperty('--accent-1-rgb', t.a1);
        root.setProperty('--accent-2-rgb', t.a2);
        root.setProperty('--accent-3-rgb', t.a3);
        root.setProperty('--glow-rgb', t.glow);
        root.setProperty('--bg-1', t.bg1);
        root.setProperty('--bg-2', t.bg2);
        root.setProperty('--bg-3', t.bg3);
        root.setProperty('--bg-base', t.bg1);
        window.__ACTIVE_THEME__ = t.name;
      })();
    </script>

  <body class="bg-[#030014] text-gray-100 overflow-x-hidden font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>

    <!--
      Hidden static form: Netlify scans the built HTML at deploy time to
      detect forms. Since the real form is rendered dynamically by React,
      this plain hidden copy (same name + fields) lets Netlify register
      it. The actual visible form in src/components/Contact.jsx submits
      to this same form name via fetch.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
